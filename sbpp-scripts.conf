PassEnv APACHE_DOCUMENT_ROOT

# Restore protections nuked by the sed above
<DirectoryMatch "^/var/www/html/web/(includes|configs|install|updater|cache|templates_c)(/|$)">
    Require all denied
</DirectoryMatch>

<Files "config.php">
    Require all denied
</Files>

<FilesMatch "(?i)^(composer\.(json|lock)|phpstan\..*|phpunit\.xml.*|package\.json|tsconfig\.json)$">
    Require all denied
</FilesMatch>
